[env]
_.path = ["/home/linuxbrew/.linuxbrew/bin", "/home/linuxbrew/.linuxbrew/sbin"]

[bootstrap.packages]
"apt:build-essential" = {}
"apt:btop" = {}
"apt:ca-certificates" = {}
"apt:curl" = {}
"apt:ffmpeg" = {}
"apt:git" = {}
"apt:gnupg" = {}
"apt:openssh-client" = {}
"apt:tar" = {}
"apt:unzip" = {}
"apt:xz-utils" = {}
"apt:zip" = {}
"apt:zsh" = {}

[bootstrap.user]
login_shell = "/usr/bin/zsh"

# Linux machines are agent VMs: passwordless sudo, no interactive chsh.
[bootstrap.hooks.pre-user]
run = '''
set -eu

expected_shell=/usr/bin/zsh
if [ ! -x "$expected_shell" ]; then
  printf 'error: The login shell is not available: %s\n' "$expected_shell" >&2
  exit 1
fi

user_name="$(id -un)"
passwd_entry="$(getent passwd "$user_name")"
current_shell="${passwd_entry##*:}"
if [ -z "$passwd_entry" ] || [ -z "$current_shell" ]; then
  printf 'error: Could not read the current login shell for %s.\n' "$user_name" >&2
  exit 1
fi
if [ "$current_shell" = "$expected_shell" ]; then
  exit 0
fi

if ! sudo -n true >/dev/null 2>&1; then
  printf 'error: Password-free sudo is required to set the login shell.\n' >&2
  exit 1
fi
sudo -n chsh -s "$expected_shell" "$user_name"

updated_entry="$(getent passwd "$user_name")"
updated_shell="${updated_entry##*:}"
if [ "$updated_shell" != "$expected_shell" ]; then
  printf 'error: The login shell was not set to %s.\n' "$expected_shell" >&2
  exit 1
fi
'''

[dotfiles]
"~/.config/git/platform.conf" = { source = "~/.dotfiles/user/linux/.config/git/platform.conf" }
"~/.config/shell/platform.sh" = { source = "~/.dotfiles/user/linux/.config/shell/linux.sh" }
