# Global hk hooks (Git 2.54+ config-based hooks), included from ~/.gitconfig.
# pre-commit always runs the global policy (~/.config/hk/config.pkl) on staged files;
# the other hooks run only in repos that define them in hk.pkl.
[hook "hk-commit-msg"]
	command = test \"${HK:-1}\" = \"0\" || ~/.local/bin/mise x hk -- hk run commit-msg --from-hook
	event = commit-msg
[hook "hk-pre-commit"]
	command = test \"${HK:-1}\" = \"0\" || ~/.local/bin/mise x hk -- hk run pre-commit --staged
	event = pre-commit
[hook "hk-pre-push"]
	command = test \"${HK:-1}\" = \"0\" || ~/.local/bin/mise x hk -- hk run pre-push --from-hook
	event = pre-push
[hook "hk-prepare-commit-msg"]
	command = test \"${HK:-1}\" = \"0\" || ~/.local/bin/mise x hk -- hk run prepare-commit-msg --from-hook
	event = prepare-commit-msg
