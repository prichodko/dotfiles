min_version = "2026.10.17"

[settings]
idiomatic_version_file_enable_tools = ["node"]
trusted_config_paths = ["~/.codex", "~/.dotfiles", "~/Projects"]
minimum_release_age_excludes = ["aqua:anthropics/claude-code", "aqua:openai/codex", "github:entireio/cli"]

[settings.npm]
package_manager = "npm"

# Keep mise itself current on every machine; tools stay pinned by mise.lock.
[settings.self_update]
auto = true

[env]
HK_PKL_BACKEND = "pklr"
HK_MISE = "1"
