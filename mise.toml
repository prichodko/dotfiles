min_version = "2026.8.16"

[settings]
experimental = true
lockfile = true
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"
idiomatic_version_file_enable_tools = ["node"]

[settings.npm]
package_manager = "npm"

[env]
HK_PKL_BACKEND = "pklr"
HK_MISE = "1"

[bootstrap.packages]
"apt:build-essential" = { os = "linux" }
"apt:btop" = { os = "linux" }
"apt:ca-certificates" = { os = "linux" }
"apt:curl" = { os = "linux" }
"apt:git" = { os = "linux" }
"apt:gnupg" = { os = "linux" }
"apt:openssh-client" = { os = "linux" }
"apt:tar" = { os = "linux" }
"apt:unzip" = { os = "linux" }
"apt:xz-utils" = { os = "linux" }
"apt:zip" = { os = "linux" }
"apt:zsh" = { os = "linux" }
"brew:git" = { os = ["linux", "macos"] }
"brew:btop" = { os = "macos" }
"brew:eza" = { os = "macos" }
"brew:gnupg" = { os = "macos" }
"brew:pinentry-mac" = { os = "macos" }
"brew:trash" = { os = "macos" }
"brew:zsh-syntax-highlighting" = { os = ["linux", "macos"] }
"brew:fzf-tab" = { os = ["linux", "macos"] }

[bootstrap.repos]
"~/.dotfiles" = { url = "https://github.com/prichodko/dotfiles.git", ref = "main" }

[bootstrap.mise_shell_activate]
zprofile = "shims"
zshrc = "activate"
bash_profile = "shims"
bashrc = "activate"

[bootstrap.remote]
source = "."
install_mise = true
exclude = [
  ".codex/**",
  ".ssh/config",
  ".DS_Store",
  "tests/tmp/**",
]

[dotfiles]
"~/.aliases" = { source = "~/.dotfiles/user/common/.aliases" }
"~/.hushlogin" = { source = "~/.dotfiles/user/common/.hushlogin" }
"~/.zshenv" = { source = "~/.dotfiles/user/common/.zshenv" }
"~/.bash_profile/machine" = { block = '''
[ -f "$HOME/.config/shell/bash.sh" ] && source "$HOME/.config/shell/bash.sh"
''' }
"~/.bashrc/machine" = { block = '''
[ -f "$HOME/.config/shell/bash.sh" ] && source "$HOME/.config/shell/bash.sh"
''' }
"~/.zprofile/machine" = { block = '''
[ -f "$HOME/.config/shell/platform.sh" ] && source "$HOME/.config/shell/platform.sh"
[ -f "$HOME/.config/shell/common.sh" ] && source "$HOME/.config/shell/common.sh"
''' }
"~/.zshrc/machine" = { block = '''
[ -f "$HOME/.config/shell/zsh.sh" ] && source "$HOME/.config/shell/zsh.sh"
''' }
"~/.gitconfig" = { source = "~/.dotfiles/user/common/.gitconfig" }
"~/AGENTS.md" = { source = "~/.dotfiles/user/common/.agents/AGENTS.md" }
"~/.agents/skills" = { source = "~/.dotfiles/.agents/skills" }
"~/.claude/CLAUDE.md" = { source = "~/.dotfiles/user/common/.agents/AGENTS.md" }
"~/.claude/skills" = { source = "~/.dotfiles/.claude/skills", mode = "symlink-each" }
"~/.codex/AGENTS.md" = { source = "~/.dotfiles/user/common/.codex/AGENTS.md" }
"~/.config/git/ignore" = { source = "~/.dotfiles/user/common/.config/git/ignore" }
"~/.config/hk/config.pkl" = { source = "~/.dotfiles/user/common/.config/hk/config.pkl" }
"~/.config/mise/config.toml" = { source = "~/.dotfiles/user/common/.config/mise/config.toml" }
"~/.config/mise/config.full.toml" = { source = "~/.dotfiles/mise.full.toml", mode = "copy" }
"~/.config/mise/conf.d/core.toml" = { source = "~/.dotfiles/mise/conf.d/core.toml", mode = "copy" }
"~/.config/mise/mise.lock" = { source = "~/.dotfiles/mise.lock", mode = "copy" }
"~/.config/mise/mise.full.lock" = { source = "~/.dotfiles/mise.full.lock", mode = "copy" }
"~/.config/mise/miserc.toml" = { source = "~/.dotfiles/.miserc.toml", mode = "copy" }
"~/.config/opencode/AGENTS.md" = { source = "~/.dotfiles/user/common/.agents/AGENTS.md" }
"~/.config/opencode/opencode.jsonc" = { source = "~/.dotfiles/user/common/.config/opencode/opencode.jsonc" }
"~/.config/shell/bash.sh" = { source = "~/.dotfiles/user/common/.config/shell/bash.sh" }
"~/.config/shell/common.sh" = { source = "~/.dotfiles/user/common/.config/shell/common.sh" }
"~/.config/shell/zsh.sh" = { source = "~/.dotfiles/user/common/.config/shell/zsh.sh" }
"~/.config/starship.toml" = { source = "~/.dotfiles/user/common/.config/starship.toml" }
"~/.local/bin/machine" = { source = "~/.dotfiles/bin/machine.ts" }

[tasks."dotfiles:check"]
description = "Validate managed dotfiles and scan for secrets"
run = "tasks/dotfiles/check.ts"

[tasks."dotfiles:pull"]
description = "Pull and apply dotfiles without publishing local changes"
run = "tasks/dotfiles/update.ts"

[tasks."dotfiles:sync"]
description = "Update dotfiles without committing or publishing local changes"
run = "tasks/dotfiles/sync.ts"

[tasks."dotfiles:publish"]
description = "Explicitly commit and publish tracked changes after validation"
run = "tasks/dotfiles/publish.ts"

[tasks."machine:apply"]
description = "Apply the native mise machine bootstrap"
run = "tasks/machine/apply"

[tasks."machine:validate"]
description = "Validate the complete machine environment"
run = "tasks/machine/validate.ts"

[tasks."machine:upgrade"]
description = "Upgrade locked tool versions and apply them locally"
run = "tasks/machine/upgrade.ts"

[tasks."machine:exe:create"]
description = "Create and bootstrap an Exe machine"
run = "tasks/machine/exe/create.ts"

[tasks."machine:exe:apply"]
description = "Update and reapply an Exe machine"
run = "tasks/machine/exe/apply.ts"

[tasks.bootstrap]
description = "Install repository TypeScript dependencies"
file = "tasks/bootstrap"

[tasks.typecheck]
description = "Type-check TypeScript"
run = "bun run typecheck"

[tasks.test]
description = "Run safe tests"
run = [
  "bun test",
  "tests/bootstrap/machine-apply.test.sh",
  "tests/bootstrap/managed-files.test.sh",
  "tests/bootstrap/shell-startup.test.sh",
]
