min_version = "2026.10.17"

[settings]
lockfile = true
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"
idiomatic_version_file_enable_tools = ["node"]

[settings.npm]
package_manager = "npm"

[env]
HK_PKL_BACKEND = "pklr"
HK_MISE = "1"

[bootstrap.packages]
"brew:git" = {}
"brew:zsh-syntax-highlighting" = {}
"brew:fzf-tab" = {}

[bootstrap.repos]
"~/.dotfiles" = { url = "https://github.com/prichodko/dotfiles.git", ref = "main" }

[bootstrap.mise_shell_activate]
zprofile = "shims"
zshrc = "activate"
bash_profile = "shims"
bashrc = "activate"

[bootstrap.remote]
source = "."
install_mise = true
exclude = [
  ".codex/**",
  ".ssh/config",
  ".DS_Store",
]

[dotfiles]
"~/.aliases" = { source = "~/.dotfiles/user/common/.aliases" }
"~/.hushlogin" = { source = "~/.dotfiles/user/common/.hushlogin" }
"~/.zshenv" = { source = "~/.dotfiles/user/common/.zshenv" }
"~/.bash_profile/machine" = { block = '''
[ -f "$HOME/.config/shell/bash.sh" ] && source "$HOME/.config/shell/bash.sh"
''' }
"~/.bashrc/machine" = { block = '''
[ -f "$HOME/.config/shell/bash.sh" ] && source "$HOME/.config/shell/bash.sh"
''' }
"~/.zprofile/machine" = { block = '''
[ -f "$HOME/.config/shell/platform.sh" ] && source "$HOME/.config/shell/platform.sh"
[ -f "$HOME/.config/shell/common.sh" ] && source "$HOME/.config/shell/common.sh"
''' }
"~/.zshrc/machine" = { block = '''
[ -f "$HOME/.config/shell/zsh.sh" ] && source "$HOME/.config/shell/zsh.sh"
''' }
"~/.gitconfig" = { source = "~/.dotfiles/user/common/.gitconfig" }
"~/AGENTS.md" = { source = "~/.dotfiles/.agents/AGENTS.md" }
"~/.agents/skills" = { source = "~/.dotfiles/.agents/skills" }
"~/.claude/CLAUDE.md" = { source = "~/.dotfiles/.agents/AGENTS.md" }
"~/.claude/skills" = { source = "~/.dotfiles/.claude/skills", mode = "symlink-each" }
"~/.claude/settings.json/base" = { source = "~/.dotfiles/user/common/.claude/base.json", merge = true }
"~/.codex/config.toml/base" = { source = "~/.dotfiles/user/common/.codex/base.toml", merge = true }
"~/.codex/AGENTS.md" = { source = "~/.dotfiles/user/common/.codex/AGENTS.md" }
"~/.config/git/hk.conf" = { source = "~/.dotfiles/user/common/.config/git/hk.conf" }
"~/.config/git/ignore" = { source = "~/.dotfiles/user/common/.config/git/ignore" }
"~/.config/hk/config.pkl" = { source = "~/.dotfiles/user/common/.config/hk/config.pkl" }
"~/.config/mise/config.toml" = { source = "~/.dotfiles/user/common/.config/mise/config.toml" }
"~/.config/mise/conf.d/core.toml" = { source = "~/.dotfiles/mise/conf.d/core.toml" }
"~/.config/mise/mise.lock" = { source = "~/.dotfiles/mise.lock" }
"~/.config/mise/miserc.toml" = { source = "~/.dotfiles/.miserc.toml", mode = "copy" }
"~/.config/opencode/AGENTS.md" = { source = "~/.dotfiles/.agents/AGENTS.md" }
"~/.config/opencode/opencode.jsonc" = { source = "~/.dotfiles/user/common/.config/opencode/opencode.jsonc" }
"~/.config/shell/bash.sh" = { source = "~/.dotfiles/user/common/.config/shell/bash.sh" }
"~/.config/shell/common.sh" = { source = "~/.dotfiles/user/common/.config/shell/common.sh" }
"~/.config/shell/zsh.sh" = { source = "~/.dotfiles/user/common/.config/shell/zsh.sh" }

[doctor.checks.git]
description = "Homebrew Git 2.54+ (config-based global hooks) is first on PATH"
run = '''
case "$(command -v git)" in /opt/homebrew/*|/home/linuxbrew/*) ;; *) exit 1 ;; esac
git --version | awk '{ split($3, v, "."); exit !(v[1] > 2 || (v[1] == 2 && v[2] >= 54)) }'
'''
hint = "Run `mise bootstrap` and open a new shell."

[doctor.checks.bootstrap]
description = "Bootstrap is complete"
run = "mise bootstrap status --missing"
hint = "Run `mise run dotfiles:apply`."
timeout = "60s"

[doctor.checks.signing]
description = "Commits are signed through the 1Password SSH agent"
os = "macos"
run = 'test "$(git config --global --get gpg.format)" = ssh && test -x "$(git config --global --includes --get gpg.ssh.program)" && ssh -G github.com | grep -q 2BUA8C4S2C.com.1password/t/agent.sock'
hint = "Install 1Password and enable its SSH agent."

[doctor.checks."auth:gh"]
description = "GitHub CLI is signed in"
run = "gh auth status"
hint = "gh auth login --git-protocol ssh --web --skip-ssh-key"

[doctor.checks."auth:entire"]
description = "Entire CLI is signed in"
run = "entire auth status"
hint = "entire auth login"

[doctor.checks."auth:codex"]
description = "Codex is signed in"
run = "codex login status"
hint = "codex login"

[doctor.checks."auth:claude"]
description = "Claude Code is signed in"
run = "claude auth status"
hint = "claude auth login"

[doctor.checks.codex-app-server]
description = "A running Codex app-server matches the installed Codex CLI"
run = '''
socket="${CODEX_HOME:-$HOME/.codex}/app-server-control/app-server-control.sock"
[ -S "$socket" ] || exit 0
codex app-server daemon version | jq -e '.status != "running" or .cliVersion == .appServerVersion' >/dev/null
'''
hint = "Restart the Codex app, or reconnect the VM in it, to load the upgraded CLI."

[tasks."dotfiles:apply"]
description = "Apply this checkout to the machine without pulling"
run = "mise bootstrap --locked --skip repos --yes"

[tasks."dotfiles:pull"]
description = "Fast-forward ~/.dotfiles from origin/main, then apply"
run = "mise bootstrap --locked --yes"

[tasks."dotfiles:check"]
description = "Validate config, links, locks, hooks and shell startup; scan for secrets"
file = "tasks/check"
