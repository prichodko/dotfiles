[env]
_.path = ["/opt/homebrew/bin", "/opt/homebrew/sbin"]

[bootstrap.packages]
"brew:btop" = {}
"brew:eza" = {}
"brew:ffmpeg" = {}
"brew:gnupg" = {}
"brew:herdr" = {}
"brew:pinentry-mac" = {}
"brew:planetscale/tap/pscale" = {}
"brew:postgresql@18" = {}
"brew:trash" = {}
"brew-cask:1password" = { adopt = true }
"brew-cask:1password-cli" = { adopt = true }
"brew-cask:chatgpt" = { adopt = true }
"brew-cask:claude" = { adopt = true }
"brew-cask:cleanshot" = { adopt = true }
"brew-cask:cloudflare-warp" = { adopt = true }
"brew-cask:cursor" = { adopt = true }
"brew-cask:figma" = { adopt = true }
"brew-cask:ghostty" = { adopt = true }
"brew-cask:google-chrome" = { adopt = true }
"brew-cask:google-chrome@canary" = { adopt = true }
"brew-cask:hyperkey" = { adopt = true }
"brew-cask:incident-io" = { adopt = true }
"brew-cask:linear" = { adopt = true }
"brew-cask:opencode-desktop" = { adopt = true }
"brew-cask:orbstack" = { adopt = true }
"brew-cask:raycast" = { adopt = true }
"brew-cask:slack" = { adopt = true }
"brew-cask:t3-code@nightly" = { adopt = true }
"brew-cask:tailscale-app" = { adopt = true }
"brew-cask:visual-studio-code" = { adopt = true }
"brew-cask:zed" = { adopt = true }
"brew-cask:zoom" = { adopt = true }
"brew-cask:font-geist-mono" = { adopt = true }

[bootstrap.macos.dock]
autohide = true
tilesize = 57
largesize = 16
magnification = false
show_recents = false
mru_spaces = false

[bootstrap.macos.finder]
show_all_files = true
preferred_view_style = "column"

[bootstrap.macos.keyboard]
initial_key_repeat = 15
key_repeat = 1
fn_state = false

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = false

[bootstrap.macos.defaults]
"com.apple.dock" = { launchanim = false, minimize-to-application = true, wvous-bl-corner = 4, wvous-bl-modifier = 0, wvous-br-corner = 1, wvous-br-modifier = 1048576 }
"com.apple.finder" = { ShowExternalHardDrivesOnDesktop = true, ShowHardDrivesOnDesktop = false, ShowRemovableMediaOnDesktop = true, ShowSidebar = true }
"NSGlobalDomain" = { AppleShowScrollBars = "Automatic", NSAutomaticSpellingCorrectionEnabled = true, NSAutomaticCapitalizationEnabled = false, NSAutomaticPeriodSubstitutionEnabled = true, NSAutomaticQuoteSubstitutionEnabled = true, NSAutomaticDashSubstitutionEnabled = true, AppleKeyboardUIMode = 3, "com.apple.mouse.scaling" = 3.0, "com.apple.trackpad.scaling" = 3.0, "com.apple.swipescrolldirection" = true, AppleInterfaceStyleSwitchesAutomatically = true, _HIHideMenuBar = false, "com.apple.sound.beep.volume" = 0.0, "com.apple.springing.enabled" = true, "com.apple.springing.delay" = 0.5 }
"com.apple.AppleMultitouchTrackpad" = { TrackpadRightClick = true, ActuationStrength = 1, FirstClickThreshold = 1, SecondClickThreshold = 1 }
"com.apple.menuextra.clock" = { ShowAMPM = true, ShowDate = 0, ShowDayOfWeek = true }
"com.apple.screencapture" = { location = "~/Downloads" }
"com.apple.universalaccess" = { closeViewScrollWheelToggle = true }
"com.apple.WindowManager" = { GloballyEnabled = false, HideDesktop = false }
"com.apple.loginwindow" = { TALLogoutSavesState = false }
"com.apple.sharingd" = { DiscoverableMode = "Off" }
"com.apple.ActivityMonitor" = { ShowCategory = 100 }

[bootstrap.user]
login_shell = "/bin/zsh"

[dotfiles]
"~/.config/ghostty/config" = { source = "~/.dotfiles/user/macos/.config/ghostty/config" }
"~/.config/git/platform.conf" = { source = "~/.dotfiles/user/macos/.config/git/platform.conf" }
"~/.config/shell/platform.sh" = { source = "~/.dotfiles/user/macos/.config/shell/macos.sh" }
"~/.config/zed/keymap.json" = { source = "~/.dotfiles/user/macos/.config/zed/keymap.json" }
"~/.config/zed/settings.json" = { source = "~/.dotfiles/user/macos/.config/zed/settings.json" }
"~/.ssh/config" = { source = "~/.dotfiles/user/macos/.ssh/config" }
"~/.t3/userdata/settings.json" = { source = "~/.dotfiles/user/macos/.t3/userdata/settings.json" }
